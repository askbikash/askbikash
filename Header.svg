<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bikash Kumar, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0F2027"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#9CCBFF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- floating glows -->
    <circle cx="180" cy="60" r="180" fill="url(#glow)">
      <animate attributeName="cx" values="180;260;180" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;100;60" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="260" r="200" fill="url(#glow)">
      <animate attributeName="cx" values="1000;930;1000" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;220;260" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- scanning accent line -->
    <rect x="0" y="286" width="1200" height="3" fill="url(#line)" opacity="0.9">
      <animate attributeName="x" values="-1200;1200" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- prompt -->
    <text x="60" y="66" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#58A6FF">&gt; whoami<tspan fill="#E6E6E6" opacity="0.9"> _</tspan>
      <animate attributeName="opacity" values="1;1;0.6;1" dur="1.6s" repeatCount="indefinite"/>
    </text>

    <!-- name -->
    <text x="58" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="url(#name)" letter-spacing="1">Bikash Kumar
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- cycling roles -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#E6E6E6">
      <text x="60" y="196">Software Engineer · 2+ Years Experience
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.28;0.33;1" values="1;1;0;0"/>
      </text>
      <text x="60" y="196">Java · DSA · Spring Boot
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.33;0.38;0.61;0.66;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="60" y="196">React · Next.js · Node.js · Laravel
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.66;0.71;0.95;1" values="0;0;1;1;0"/>
      </text>
    </g>

    <!-- chips -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#E6E6E6">
      <g>
        <rect x="60" y="228" width="148" height="32" rx="16" fill="#58A6FF" fill-opacity="0.14" stroke="#58A6FF" stroke-opacity="0.6"/>
        <text x="134" y="249" text-anchor="middle">SaaS · ERP · CRM</text>
      </g>
      <g>
        <rect x="220" y="228" width="190" height="32" rx="16" fill="#58A6FF" fill-opacity="0.14" stroke="#58A6FF" stroke-opacity="0.6"/>
        <text x="315" y="249" text-anchor="middle">Bangalore · Hyderabad</text>
      </g>
      <g>
        <rect x="422" y="228" width="200" height="32" rx="16" fill="#2EA043" fill-opacity="0.18" stroke="#2EA043" stroke-opacity="0.8"/>
        <circle cx="442" cy="244" r="5" fill="#3FB950">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="458" y="249">Available Immediately</text>
      </g>
    </g>

    <!-- code window -->
    <g>
      <rect x="800" y="44" width="350" height="212" rx="12" fill="#0b1220" fill-opacity="0.82" stroke="#58A6FF" stroke-opacity="0.35"/>
      <circle cx="822" cy="64" r="5.5" fill="#FF5F56"/>
      <circle cx="842" cy="64" r="5.5" fill="#FFBD2E"/>
      <circle cx="862" cy="64" r="5.5" fill="#27C93F"/>
      <text x="1128" y="68" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8B949E">developer.js</text>
      <g font-family="Consolas, 'Courier New', monospace" font-size="15">
        <text x="820" y="102" fill="#E6E6E6" opacity="0"><tspan fill="#FF7B72">const</tspan> <tspan fill="#79C0FF">dev</tspan> = {<animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/></text>
        <text x="840" y="128" fill="#E6E6E6" opacity="0">name: <tspan fill="#A5D6FF">"Bikash Kumar"</tspan>,<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/></text>
        <text x="840" y="154" fill="#E6E6E6" opacity="0">role: <tspan fill="#A5D6FF">"Software Engineer"</tspan>,<animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/></text>
        <text x="840" y="180" fill="#E6E6E6" opacity="0">stack: [<tspan fill="#A5D6FF">"Java"</tspan>, <tspan fill="#A5D6FF">"React"</tspan>, <tspan fill="#A5D6FF">"Node"</tspan>],<animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze"/></text>
        <text x="840" y="206" fill="#E6E6E6" opacity="0">openToWork: <tspan fill="#79C0FF">true</tspan>,<animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.2s" fill="freeze"/></text>
        <text x="820" y="232" fill="#E6E6E6" opacity="0">};<animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze"/></text>
      </g>
    </g>
  </g>
</svg>
